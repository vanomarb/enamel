<script>
  // firstWord is the same rule as firstWord() in app/lib/account.ts; tests/pages.test.ts runs both.
  (() => {
    const root = document.documentElement
    root.classList.add('js')
    setTimeout(() => root.hasAttribute('data-reveal-ready') || root.classList.remove('js'), 3000)
    const firstWord = (name) => Array.from(String(name).trim().split(/\s+/)[0].replace(/["\\<>]/g, '')).slice(0, 16).join('')
    try {
      const name = firstWord(JSON.parse(localStorage.getItem('enamel.account') || 'null')?.firstName || '')
      if (name) {
        root.setAttribute('data-signed-in', '')
        root.style.setProperty('--account-name', `"${name}"`)
      }
    } catch {}
  })()
</script>
